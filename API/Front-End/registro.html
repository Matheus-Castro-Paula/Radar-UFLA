<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro — Radar UFLA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">

  <main class="auth-card">
    <a class="auth-brand" href="index.html">
      <span class="wordmark-mark">◎</span> Radar UFLA
    </a>
    <h1 class="auth-title">Criar conta</h1>
    <p class="auth-subtitle">Cadastre-se para publicar itens achados e perdidos.</p>

    <form id="registro-form" class="auth-form">
      <div class="auth-field">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Seu nome" required autocomplete="name" />
      </div>
      <div class="auth-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="voce@ufla.br" required autocomplete="email" />
      </div>
      <div class="auth-field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Crie uma senha" required autocomplete="new-password" />
        <span class="auth-hint">Use uma senha que você não utiliza em outros sites.</span>
      </div>

      <label class="consent" for="consentimento-lgpd">
        <input type="checkbox" id="consentimento-lgpd" />
        <span>
          Li e concordo com o tratamento dos meus dados pessoais (nome e e-mail) conforme a
          <a href="privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>,
          em atendimento à LGPD (Lei nº 13.709/2018).
        </span>
      </label>

      <p class="form-message" id="form-message" role="alert" hidden></p>

      <button type="submit" class="auth-btn">Criar conta</button>
    </form>

    <p class="auth-footer">Já tem conta? <a href="login.html">Entrar</a></p>
    <p class="auth-footer"><a href="index.html">← Voltar ao feed</a></p>
  </main>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radar UFLA — Achados e perdidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <a class="wordmark" href="index.html">
      <span class="wordmark-mark">◎</span>
      <div>
        <h1>Radar UFLA</h1>
        <p class="tagline">achados e perdidos do campus</p>
      </div>
    </a>

    <div class="search-box">
      <label for="search" class="visually-hidden">Buscar itens</label>
      <input type="search" id="search" placeholder="Buscar por objeto, local..." autocomplete="off" />
    </div>

    <a class="btn-login" id="btn-login" href="login.html">Entrar</a>
    <a class="btn-publish" href="publicar.html">Publicar item</a>
  </header>

  <nav class="tabs" role="tablist" aria-label="Feeds de itens">
    <button class="tab tab-achados active" role="tab" aria-selected="true" data-feed="achados">
      Achados <span class="tab-count" id="count-achados">0</span>
    </button>
    <button class="tab tab-perdidos" role="tab" aria-selected="false" data-feed="perdidos">
      Perdidos <span class="tab-count" id="count-perdidos">0</span>
    </button>
  </nav>

  <div class="layout">
    <aside class="filters">
      <h3>Categoria</h3>
      <label><input type="checkbox" value="objeto" checked /> Objeto pessoal</label>
      <label><input type="checkbox" value="eletronico" checked /> Eletrônico</label>
      <label><input type="checkbox" value="documento" checked /> Documento</label>
      <label><input type="checkbox" value="material" checked /> Material acadêmico</label>
      <label><input type="checkbox" value="outro" checked /> Outro</label>

      <hr />

      <h3>Local</h3>
      <label class="field-inline">
        <input type="text" id="filtro-local" placeholder="Ex: Bloco 3" />
      </label>
    </aside>

    <main>
      <section id="feed" class="feed" aria-live="polite"></section>
      <p class="empty-state" id="empty-state" hidden>Nada por aqui ainda com esses filtros.</p>
    </main>
  </div>

  <footer class="site-footer">
    Radar UFLA · Projeto de Engenharia de Software ·
    <a href="privacidade.html">Política de Privacidade (LGPD)</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>

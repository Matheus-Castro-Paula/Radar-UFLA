<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Radar UFLA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">

  <main class="auth-card">
    <a class="auth-brand" href="index.html">
      <span class="wordmark-mark">◎</span> Radar UFLA
    </a>
    <h1 class="auth-title">Entrar</h1>
    <p class="auth-subtitle">Acesse para publicar e gerenciar seus anúncios.</p>

    <form id="login-form" class="auth-form">
      <div class="auth-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="voce@ufla.br" required autocomplete="email" />
      </div>
      <div class="auth-field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Sua senha" required autocomplete="current-password" />
      </div>

      <p class="form-message" id="form-message" role="alert" hidden></p>

      <button type="submit" class="auth-btn">Entrar</button>
    </form>

    <p class="auth-footer">Não tem conta? <a href="registro.html">Cadastre-se</a></p>
    <p class="auth-footer"><a href="index.html">← Voltar ao feed</a></p>
  </main>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publicar item — Radar UFLA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header simple">
    <a class="back-link" href="index.html">← Voltar ao feed</a>
    <h1 class="page-title">Publicar item</h1>
  </header>

  <main class="publish-main">
    <form id="publish-form" class="publish-form" novalidate>
      <div class="segmented" role="radiogroup" aria-label="Este item é achado ou perdido">
        <label class="segmented-option active">
          <input type="radio" name="tipo" value="achados" checked /> Um achado
        </label>
        <label class="segmented-option">
          <input type="radio" name="tipo" value="perdidos" /> Uma perda
        </label>
      </div>

      <div class="form-grid">
        <div class="form-fields">
          <label class="field">
            <span class="field-label">Título</span>
            <input type="text" id="titulo" name="titulo" placeholder="Ex: Molho de chaves com chaveiro azul" required />
          </label>

          <label class="field">
            <span class="field-label">Categoria</span>
            <select name="categoria" id="categoria">
              <option value="objeto">Objeto pessoal</option>
              <option value="eletronico">Eletrônico</option>
              <option value="documento">Documento (sem foto)</option>
              <option value="material">Material acadêmico</option>
              <option value="outro">Outro</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">Descrição</span>
            <textarea id="descricao" name="descricao" rows="4" placeholder="Detalhes que ajudem a identificar o item"></textarea>
          </label>

          <div class="field-row">
            <label class="field">
              <span class="field-label">Local</span>
              <input type="text" name="local" placeholder="Ex: Bloco 3, sala 12" />
            </label>
            <label class="field">
              <span class="field-label">Data e hora</span>
              <input type="datetime-local" id="data-ocorrencia" name="data_ocorrencia" required />
            </label>
          </div>
        </div>

        <div class="upload-column" id="upload-column">
          <label class="upload-area" id="upload-area" for="fotos">
            <input type="file" id="fotos" name="fotos" accept="image/jpeg,image/png,image/webp" multiple />
            <span class="upload-icon" aria-hidden="true">📷</span>
            <span>Arraste até 3 fotos ou clique para escolher</span>
            <span class="upload-hint">JPG, PNG ou WEBP, até 5 MB cada</span>
          </label>
          <ul class="foto-previews" id="foto-previews" aria-label="Fotos selecionadas"></ul>
        </div>
      </div>

      <p class="field-note" id="doc-note" hidden>
        Itens da categoria "Documento" não exibem foto, por segurança (LGPD) — apenas a descrição textual será publicada.
        Não informe CPF, RG, matrícula ou outros números de documento.
      </p>

      <p class="form-message" id="form-message" role="alert" hidden></p>

      <button type="submit" class="btn-submit">Publicar</button>
    </form>
  </main>

  <footer class="site-footer">
    <a href="privacidade.html">Política de Privacidade (LGPD)</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>

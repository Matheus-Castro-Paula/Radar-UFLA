# Ambiente de desenvolvimento. As credenciais vêm do arquivo .env (copie o
# .env.example): o Compose lê esse arquivo sozinho para preencher as ${...}.
# M-11: nenhuma senha fica escrita aqui; só valores que não são segredo têm padrão.
services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env (veja o .env.example)}
      MYSQL_DATABASE: ${DB_NAME:-radar_ufla}
    ports:
      # Só a própria máquina acessa o banco; a porta muda com DB_PORTA_HOST
      - "127.0.0.1:${DB_PORTA_HOST:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: api_backend
    ports:
      # Mesmo valor dos dois lados: o server.js passa a ouvir em PORT (M-10)
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - .:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    env_file:
      - .env
    environment:
      # Dentro da rede do Compose o banco é o serviço "db", na porta padrão
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env (veja o .env.example)}
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  mysql_data:
  uploads_data:
